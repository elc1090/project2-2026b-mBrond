databases:
  - name: hubis-db
    plan: free

services:
  - type: web
    name: hubis-backend
    runtime: python
    plan: free
    rootDir: back-main
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: hubis-db
          property: connectionString


  - type: web
    name: hubis-frontend
    runtime: static
    rootDir: front-main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
